[workspace]
resolver = "2"
members = [
    "core",
    "evolve",
    "BRAIN/brain",
    "BRAIN/memory",
    "BODY/body",
    "BODY/speech",
    "BODY/bridge",
]

[workspace.package]
version = "0.1.0-alpha.27"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

